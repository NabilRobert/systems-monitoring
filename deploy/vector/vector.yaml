# Vector's global settings. The pipelines are in security.yaml (slice 1)
# and host-metrics.yaml (slice 3); compose loads all three.

data_dir: /var/lib/vector

# Only for the container's health check, on loopback (ignored by the port
# rule, which skips loopback listeners).
api:
  enabled: true
  address: 127.0.0.1:8686
