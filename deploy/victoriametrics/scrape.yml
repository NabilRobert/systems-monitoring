# What VictoriaMetrics scrapes (Phase 5, ADR-003 and ADR-005). Host and
# container metrics are not scraped: Vector pushes them (remote write).
global:
  scrape_interval: 30s

scrape_configs:
  # One blackbox probe per target in deploy/targets/*.yml. Each target
  # carries an `app` label, which alerts and SLOs use.
  - job_name: probe
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: [/etc/victoriametrics/targets/*.yml]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # The prober itself, so "no probe results" can be told from "app down".
  - job_name: blackbox
    static_configs:
      - targets: [blackbox:9115]
